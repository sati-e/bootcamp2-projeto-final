<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartas com trilha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kapakana:wght@300..400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="pagina">
    <form id="form-carta" class="carta-form">

      <!-- carta -->
      <section class="papel" aria-label="Carta">
        <div class="campo campo-para">
          <label for="para">Para</label>
          <input type="text" id="para" name="para" placeholder="Nome de quem vai receber" required>
        </div>

        <div class="campo campo-texto">
          <label for="texto" class="sr-only">Texto da carta</label>
          <textarea id="texto" name="texto" rows="8" placeholder="Querido(a), escreva aqui a mensagem que você quer tanto falar pra ele que eu sei…" required></textarea>
        </div>

        <div class="rodape-carta">
          <!-- musica escolhida -->
          <div class="musica-escolhida" id="musica-escolhida">
            <img src="" alt="" class="capa" id="escolhida-capa" width="80" height="80">
            <div class="info">
              <strong class="titulo" id="escolhida-titulo">Nome da música</strong>
              <span class="artista" id="escolhida-artista">Nome do Autor</span>
              <input type="range" id="progresso" min="0" max="100" value="0" aria-label="Progresso da música">
              <button type="button" id="btn-play" aria-label="Pausar">Pausar</button>
            </div>
            <audio id="preview"></audio>
          </div>

          <div class="campo campo-de">
            <label for="de">De</label>
            <input type="text" id="de" name="de" placeholder="Seu nome">
          </div>
        </div>

        <input type="hidden" id="musica-id" name="musica_id">
      </section>

      <!-- escolha da musica -->
      <aside class="lateral">
        <section class="musica" aria-label="Escolha a música">
          <h2>Escolha a música</h2>

          <label for="busca-musica" class="sr-only">Buscar música</label>
          <input type="search" id="busca-musica" placeholder="Digite o nome da música" autocomplete="off">

          <!-- cada item é um botão: clicar escolhe a música -->
          <ul id="resultados" class="resultados">
            <li>
              <button type="button" class="resultado">
                <img src="" alt="" class="capa" width="40" height="40">
                <span class="info">
                  <strong class="titulo">Nome da música</strong>
                  <span class="artista">Nome do Artista</span>
                </span>
              </button>
            </li>
            <!-- resultados JS -->
          </ul>
        </section>

        <button type="submit" class="btn-gerar">Gerar link</button>
      </aside>

    </form>

    <!-- aparece depois de gerar -->
    <section id="resultado-link" class="link-gerado" hidden>
      <h2>Sua carta está pronta</h2>
      <input type="text" id="link" readonly aria-label="Link da carta">
      <button type="button" id="btn-copiar">Copiar link</button>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
