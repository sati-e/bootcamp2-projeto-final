<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uma carta para você</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kapakana:wght@300..400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="pagina">
    <article class="papel" aria-label="Carta">

      <div class="campo campo-para">
        <span class="rotulo">Para</span>
        <p id="destinatario" class="valor">Nome de quem recebe</p>
      </div>

      <div class="campo campo-texto">
        <div id="texto-carta" class="texto">
          <!-- o texto da carta entra via JS -->
          <p>Texto da carta.</p>
        </div>
      </div>

      <div class="rodape-carta">
        <div class="musica-escolhida" id="musica-escolhida">
          <img src="" alt="" class="capa" id="escolhida-capa" width="80" height="80">
          <div class="info">
            <strong class="titulo" id="escolhida-titulo">Nome da música</strong>
            <span class="artista" id="escolhida-artista">Nome do Autor</span>
            <input type="range" id="progresso" min="0" max="100" value="0" aria-label="Progresso da música">
            <button type="button" id="btn-play" aria-label="Pausar">Pausar</button>
          </div>
          <audio id="preview"></audio>
        </div>

        <div class="campo campo-de">
          <span class="rotulo">De</span>
          <p id="remetente" class="valor">Nome de quem enviou</p>
        </div>
      </div>

    </article>
  </main>

  <script src="js/carta.js"></script>
</body>
</html>
